<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🦜 TEST FOR UNIT 7 · p3 (VII · VIII · IX) — Ms. Chí Nên</title>
<link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@600;700&family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{--grn:#16A34A;--deep:#14532D;--soft:#BBF7D0;--lime:#84CC16;--teal:#0D9488;--sun:#FACC15;
  --bad:#EF4444;--ink:#14342B}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Nunito',sans-serif;color:var(--ink);
  background:linear-gradient(160deg,#F0FDF4,#DCFCE7 52%,#ECFCCB);background-attachment:fixed}
/* ── LỚP MÀU XANH LOANG (như màu nước lan trên giấy) ── */
.lo{position:fixed;inset:-24%;z-index:0;pointer-events:none;filter:blur(42px);opacity:.62;
  background:
   radial-gradient(34% 30% at 14% 18%,rgba(132,204,22,.55),transparent 68%),
   radial-gradient(38% 32% at 84% 12%,rgba(16,185,129,.50),transparent 68%),
   radial-gradient(42% 36% at 76% 70%,rgba(52,211,153,.46),transparent 68%),
   radial-gradient(36% 30% at 22% 82%,rgba(163,230,53,.48),transparent 68%),
   radial-gradient(30% 26% at 50% 46%,rgba(13,148,136,.38),transparent 68%),
   radial-gradient(26% 22% at 6% 52%,rgba(74,222,128,.44),transparent 68%),
   radial-gradient(28% 24% at 94% 44%,rgba(190,242,100,.42),transparent 68%);
  animation:loang 27s ease-in-out infinite alternate}
@keyframes loang{from{transform:translate3d(-3%,-2%,0) scale(1) rotate(0deg)}
  to{transform:translate3d(3%,2%,0) scale(1.14) rotate(4deg)}}
.lo2{position:fixed;inset:0;z-index:0;pointer-events:none;
  background-image:radial-gradient(rgba(20,83,45,.11) 1.5px,transparent 1.6px);background-size:22px 22px}
/* ── TIM BAY ĐA MÀU ĐA HÌNH ── */
.hs{position:fixed;inset:0;overflow:hidden;pointer-events:none;z-index:0}
.h{position:absolute;bottom:-60px;animation:rise linear infinite}
.h i{display:block;animation:sway ease-in-out infinite alternate;font-style:normal;line-height:1}
@keyframes rise{0%{transform:translateY(0);opacity:0}7%{opacity:.9}90%{opacity:.9}
  100%{transform:translateY(-116vh);opacity:0}}
@keyframes sway{from{transform:translateX(-16px) rotate(-16deg)}to{transform:translateX(16px) rotate(16deg)}}
.ch{position:relative;width:var(--s);height:var(--s);background:var(--c);transform:rotate(-45deg);
  border-radius:0 0 4px 0}
.ch::before,.ch::after{content:'';position:absolute;width:var(--s);height:var(--s);background:var(--c);border-radius:50%}
.ch::before{top:calc(var(--s)/-2);left:0}
.ch::after{top:0;left:calc(var(--s)/2)}
.ch.slim{border-radius:0 0 45% 0}
.ch.out{background:transparent;border:2.5px solid var(--c);border-top-color:transparent;border-left-color:transparent}
.ch.out::before,.ch.out::after{background:transparent;border:2.5px solid var(--c)}
.wrap{position:relative;z-index:1;max-width:860px;margin:0 auto;padding:16px 14px 80px}
h1,h2,h3,.pill,.qn,.sbtn,.ck,.lb,.l{font-family:'Quicksand',sans-serif;font-weight:700}
.note{position:relative;border-radius:3px 3px 16px 3px;box-shadow:4px 6px 14px rgba(20,83,45,.20)}
.note::after{content:'';position:absolute;right:0;bottom:0;width:24px;height:24px;
  background:linear-gradient(135deg,transparent 50%,rgba(20,83,45,.17) 50%);border-radius:0 0 14px 0}
.pin{position:absolute;top:-9px;left:50%;transform:translateX(-50%);width:18px;height:18px;border-radius:50%;
  background:radial-gradient(circle at 35% 30%,#fff 8%,var(--lime) 42%,var(--deep));box-shadow:0 2px 5px rgba(0,0,0,.25)}
.hdr{background:linear-gradient(180deg,#D9F99D,var(--soft));padding:18px 18px 16px;text-align:center;
  margin:8px 0 18px;transform:rotate(-.5deg)}
.hdr h1{font-size:clamp(18px,4vw,27px);line-height:1.3;color:var(--deep)}
.hdr p{font-size:.83rem;font-weight:800;color:#15803D;margin-top:6px}
.sb{position:sticky;top:8px;z-index:9;background:#fff;border-radius:999px;box-shadow:0 4px 14px rgba(20,83,45,.22);
  display:flex;align-items:center;gap:10px;padding:8px 16px;margin-bottom:18px;border:2px solid var(--soft)}
.sb b{font-family:'Quicksand',sans-serif;font-size:1.1rem;color:var(--deep)}
.tr{flex:1;height:11px;background:#E4F6E9;border-radius:999px;overflow:hidden}
.fl{height:100%;width:0;background:linear-gradient(90deg,var(--lime),var(--grn),var(--teal));transition:width .45s}
.sec{background:linear-gradient(180deg,#F8FEF9,#EEFBF1);padding:16px 14px 18px;margin-bottom:24px}
.sec:nth-child(even){transform:rotate(.35deg)}.sec:nth-child(odd){transform:rotate(-.3deg)}
.st{display:flex;flex-wrap:wrap;align-items:center;gap:9px;margin:2px 0 5px}
.pill{color:#fff;border-radius:999px;padding:2px 14px;font-size:.95rem;box-shadow:0 3px 8px rgba(20,83,45,.26)}
.st h2{font-size:1.06rem;line-height:1.35;color:var(--deep)}
.si{font-size:.89rem;font-weight:700;color:#15803D;font-style:italic;margin:2px 0 12px;line-height:1.6}
.th{background:linear-gradient(180deg,#FEFCE8,#FEF9C3);padding:12px 13px 14px;margin-bottom:14px;
  border-radius:3px 3px 14px 3px;box-shadow:3px 4px 10px rgba(160,120,0,.16);position:relative}
.th::after{content:'';position:absolute;right:0;bottom:0;width:22px;height:22px;
  background:linear-gradient(135deg,transparent 50%,rgba(160,120,0,.15) 50%);border-radius:0 0 12px 0}
.th h3{font-size:1rem;color:#854D0E;margin-bottom:9px;line-height:1.4}
.ru{background:#fff;border-left:6px solid var(--grn);border-radius:0 10px 10px 0;padding:7px 11px;margin-bottom:7px;
  font-size:.93rem;line-height:1.75;font-weight:700;box-shadow:0 2px 6px rgba(0,0,0,.06)}
.ru b{color:var(--deep)}
.eg{display:inline-block;background:#E9FBEF;border:1.5px solid var(--grn);border-radius:8px;padding:0 8px;
  font-weight:800;color:var(--deep);margin:2px 3px 0 0}
.tb{width:100%;border-collapse:collapse;margin:8px 0;font-size:.87rem}
.tb th{background:var(--grn);color:#fff;padding:6px 8px;border:1.5px solid #fff;font-family:'Quicksand',sans-serif;font-size:.9rem}
.tb td{background:#fff;padding:6px 8px;border:1.5px solid #CCEBD6;font-weight:700;line-height:1.65}
.tb tr:nth-child(even) td{background:#F6FDF8}
.tb td b{color:var(--grn)}.tb td s{color:var(--bad)}
.tip{background:#ECFEFF;border:2px solid var(--teal);border-radius:12px;padding:8px 12px;font-size:.92rem;
  font-weight:700;line-height:1.78;color:#115E59}
.wn{background:#FEF2F2;border:2px solid var(--bad);border-radius:12px;padding:8px 12px;font-size:.92rem;
  font-weight:700;line-height:1.78;color:#991B1B;margin-top:8px}
.wn s{color:#DC2626}
.wb{background:#F7FEE7;border:2px dashed var(--lime);border-radius:14px;padding:10px 12px 12px;margin-bottom:14px}
.wb .lb{font-size:.9rem;color:#4D7C0F;margin-bottom:7px}
.wb .cs{display:flex;flex-wrap:wrap;gap:7px}
.wb span{background:#fff;border:2px solid var(--lime);border-radius:9px;padding:3px 12px;font-weight:800;
  font-size:.93rem;box-shadow:0 2px 5px rgba(77,124,15,.15);transition:.2s}
.wb span.used{opacity:.32;text-decoration:line-through;box-shadow:none}
.q{background:#fff;border-radius:3px 3px 13px 3px;padding:11px 12px 12px;margin-bottom:11px;
  box-shadow:2px 3px 9px rgba(20,83,45,.13);border-left:5px solid var(--soft)}
.q.shk{animation:shk .42s}
@keyframes shk{0%,100%{transform:translateX(0)}25%{transform:translateX(-7px)}75%{transform:translateX(7px)}}
.qn{display:inline-block;background:var(--grn);color:#fff;border-radius:8px;min-width:30px;text-align:center;
  padding:0 8px;margin-right:7px;font-size:.93rem;box-shadow:0 2px 5px rgba(22,163,74,.35)}
.qt{font-weight:700;font-size:1rem;line-height:1.85}
.qt .bl{display:inline-block;min-width:94px;border-bottom:3px solid var(--grn);text-align:center;color:var(--grn);font-weight:900}
.qt u{background:var(--sun);border-radius:5px;padding:0 5px;text-decoration:none;font-weight:900}
.src{background:#F6FDF8;border-left:5px solid var(--lime);border-radius:0 11px 11px 0;padding:8px 12px;margin-top:8px;
  font-weight:800;font-size:1rem;line-height:1.8}
.quote{background:#F0F9FF;border-left:5px solid #38BDF8;border-radius:0 11px 11px 0;padding:9px 12px;margin-top:8px;
  font-weight:800;font-size:1.02rem;line-height:1.8;color:#075985;font-style:italic}
.cue{background:#FFFBEB;border:2px dashed var(--sun);border-radius:11px;padding:8px 12px;margin-top:8px;
  font-weight:800;font-size:1rem;line-height:1.8;color:#854D0E}
/* ── TÌM &amp; SỬA LỖI A·B·C·D ── */
.segs{display:flex;flex-wrap:wrap;gap:7px;margin-top:10px}
.sg{background:#F7FEF9;border:2px solid var(--soft);border-radius:11px;padding:6px 12px;font-weight:800;
  font-size:.97rem;cursor:pointer;box-shadow:0 2px 6px rgba(20,83,45,.12);transition:.14s;line-height:1.6;
  color:var(--ink)}
.sg b{display:inline-block;background:var(--grn);color:#fff;border-radius:6px;padding:0 6px;margin-right:6px;
  font-size:.84rem;font-family:'Quicksand',sans-serif}
.sg:hover:not(.dn){transform:translateY(-2px);background:#E7FBEE;border-color:var(--grn)}
.sg.sel{border-color:var(--lime);background:#F4FCE3;box-shadow:0 0 0 3px rgba(132,204,22,.32)}
.sg.dn{cursor:default;transform:none}
.sg.sgok{background:#D1FAE5;border-color:var(--grn);color:var(--deep)}
.sg.sgok b{background:var(--grn)}
.sg.sgno{background:#FEE2E2;border-color:var(--bad);color:#991B1B}
.sg.sgno b{background:var(--bad)}
.sg.sgdim{opacity:.45}
.fz{max-height:0;overflow:hidden;transition:max-height .32s ease;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.fz.open{max-height:220px;margin-top:11px}
.fz.shk{animation:shk .42s}
.fzl{font-weight:800;color:var(--deep);font-size:.93rem;width:100%}
.hint{margin-top:9px;background:#FEFCE8;border:1.5px dashed var(--sun);border-radius:10px;padding:7px 11px;
  font-size:.87rem;font-weight:700;color:#854D0E;line-height:1.7}
.og{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.og.c4{grid-template-columns:repeat(4,1fr)}.og.c1{grid-template-columns:1fr}
@media(max-width:640px){.og.c4{grid-template-columns:repeat(2,1fr)}}
@media(max-width:520px){.og{grid-template-columns:1fr}}
.ob{background:#F7FEF9;border:2px solid var(--soft);border-radius:11px;padding:9px 12px;font-family:'Nunito';
  font-size:.96rem;font-weight:800;cursor:pointer;box-shadow:0 3px 7px rgba(20,83,45,.12);transition:.14s;
  text-align:left;line-height:1.55;color:var(--ink)}
.ob:hover:not(.dn){transform:translateY(-2px);background:#E7FBEE;border-color:var(--grn)}
.ob.ok{background:#D1FAE5;border-color:var(--grn);color:#065F46}
.ob.no{background:#FEE2E2;border-color:var(--bad);color:#991B1B}
.ob.dim{opacity:.4}
.fr{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:9px}
.ti{flex:1;min-width:190px;padding:9px 13px;border:2px solid var(--soft);border-radius:11px;font-family:'Nunito';
  font-size:.98rem;font-weight:800;outline:none;background:#FCFFFD}
.ti:focus{border-color:var(--grn);background:#fff}
.ti.ok{border-color:var(--grn);background:#D1FAE5}.ti.no{border-color:var(--bad);background:#FEE2E2}
.ck{background:var(--grn);color:#fff;border:none;border-radius:11px;padding:9px 18px;font-size:.98rem;cursor:pointer;
  box-shadow:0 4px 10px rgba(22,163,74,.35);white-space:nowrap}
.ck.gh{background:#fff;color:var(--grn);border:2px solid var(--grn);box-shadow:none}
.ck:hover:not(:disabled){transform:translateY(-2px)}
.ck:disabled{opacity:.4;cursor:default}
.ex{display:none;margin-top:10px;background:#FCFFFD;border-radius:12px;padding:12px;font-size:.94rem;line-height:1.75;
  box-shadow:0 3px 10px rgba(20,83,45,.14);border:1.5px solid #CCEBD6}
.ex.show{display:block}
.kb{background:#D1FAE5;border:1.5px solid var(--grn);border-radius:9px;padding:7px 11px;margin-bottom:8px;
  font-weight:900;color:#065F46;line-height:1.7}
.vi{background:#FFF7E0;border-left:4px solid var(--sun);border-radius:0 8px 8px 0;padding:6px 11px;margin-bottom:8px;
  font-weight:700;color:#854D0E;line-height:1.7}
.sp{background:#F6FDF8;border:1.5px solid #CCEBD6;border-radius:9px;padding:7px 11px;margin-bottom:7px;line-height:1.75}
.sp .l{display:inline-block;background:var(--teal);color:#fff;border-radius:6px;padding:0 8px;font-size:.85rem;margin-bottom:3px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin:5px 0}
@media(max-width:600px){.g2{grid-template-columns:1fr}}
.g2>div{background:#fff;border:1.5px solid #DCF2E3;border-radius:8px;padding:5px 9px;line-height:1.65;font-weight:700}
.w{color:#1D4ED8;font-weight:800}.m{color:#C2410C;font-weight:700}.g{color:var(--grn);font-weight:900}
.t{background:#DCFCE7;color:#15803D;padding:1px 5px;border-radius:4px;font-size:.78em;font-weight:800;margin:0 3px}
.pg{background:linear-gradient(transparent 54%,#FDE68A 54%);font-weight:800;line-height:2}
.ipa{color:#7B1FA2;background:rgba(123,31,162,.09);border-radius:4px;padding:1px 5px;font-family:'Courier New',monospace;font-size:.88em;font-weight:800}
.fx{display:inline-block;background:#FEE2E2;color:#991B1B;border-radius:6px;padding:0 6px;font-weight:900;
  text-decoration:line-through}
.fy{display:inline-block;background:#D1FAE5;color:#065F46;border-radius:6px;padding:0 6px;font-weight:900}
.sub{text-align:center;margin-top:22px}
.sbtn{background:var(--grn);color:#fff;border:none;border-radius:999px;padding:13px 40px;font-size:1.2rem;cursor:pointer;
  box-shadow:0 6px 16px rgba(22,163,74,.4)}
.sbtn:hover{transform:translateY(-2px)}
.ov{position:fixed;inset:0;background:rgba(20,52,43,.72);z-index:99;display:none;align-items:center;justify-content:center;
  padding:16px;overflow-y:auto;backdrop-filter:blur(3px)}
.ov.on{display:flex}
.mb{background:linear-gradient(180deg,#F8FEF9,#E7FBEE);border-radius:3px 3px 18px 3px;box-shadow:5px 7px 22px rgba(0,0,0,.35);
  padding:22px;width:410px;max-width:96%;text-align:center;position:relative}
.mb h2{font-size:1.35rem;color:var(--deep);margin-bottom:10px;line-height:1.25}
.mb input{width:100%;padding:11px;border:2px solid var(--soft);border-radius:11px;font-family:'Nunito';font-weight:800;
  font-size:1rem;text-align:center;outline:none;margin-bottom:10px}
.mb input.er{border-color:var(--bad);background:#FEE2E2;animation:shk .42s}
.mb .em{color:var(--bad);font-weight:800;font-size:.86rem;display:none;margin-bottom:8px}
.mb .gr{font-family:'Quicksand',sans-serif;font-weight:700;font-size:1.22rem;color:var(--deep);line-height:1.3;margin-bottom:4px}
.mb .rs{font-family:'Quicksand',sans-serif;font-weight:700;font-size:2.5rem;color:var(--grn)}
.mb .rt{font-weight:900;color:#4D7C0F;font-size:1.08rem;margin:4px 0 6px}
.mb .rm{font-weight:700;font-size:.93rem;line-height:1.65;margin-bottom:10px}
.mb img{width:100%;max-width:250px;border-radius:13px;margin:10px auto;display:block}
.cf{position:fixed;top:-12px;width:9px;height:14px;z-index:100;pointer-events:none;border-radius:2px}
@keyframes fall{to{transform:translateY(105vh) rotate(700deg);opacity:.2}}
</style>
<style>/*scn*/.zam .wk{position:absolute;left:0;animation:zamW linear infinite}.zam .wk.rv{animation-name:zamW2}.zam .wk svg{display:block}.zam .flp{display:inline-block;transform:scaleX(-1)}@keyframes zamW{from{transform:translateX(-22vw)}to{transform:translateX(112vw)}}@keyframes zamW2{from{transform:translateX(112vw)}to{transform:translateX(-22vw)}}
.zam .l1{animation:zamLg .5s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:50% 0}.zam .l2{animation:zamLg .5s ease-in-out infinite alternate-reverse;transform-box:fill-box;transform-origin:50% 0}@keyframes zamLg{from{transform:rotate(-12deg)}to{transform:rotate(12deg)}}
.zam{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden;background:linear-gradient(180deg,#A7F3D0 0%,#6EE7B7 24%,#34D399 50%,#059669 76%,#065F46 100%)}
.zam svg.scene{position:absolute;inset:0;width:100%;height:100%}
.zam .mist{animation:zamMist 2.4s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:center}@keyframes zamMist{from{transform:scale(.8);opacity:.5}to{transform:scale(1.2);opacity:.95}}
.zam .bb{animation:zamBuf .5s ease-in-out infinite alternate}@keyframes zamBuf{from{transform:translateY(0)}to{transform:translateY(-2.5px)}}
.zam .boy{animation:zamBoy 1s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:50% 100%}@keyframes zamBoy{from{transform:rotate(-2.5deg)}to{transform:rotate(2.5deg)}}
.zam .tl{animation:zamTl .7s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:100% 0}@keyframes zamTl{from{transform:rotate(-12deg)}to{transform:rotate(12deg)}}
.zam .hd{animation:zamHd .8s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:0 100%}@keyframes zamHd{from{transform:rotate(-3deg)}to{transform:rotate(4deg)}}
.zam .nt{animation:zamNt 2.1s ease-out infinite}@keyframes zamNt{0%{transform:translate(0,0);opacity:0}25%{opacity:1}100%{transform:translate(26px,-38px) rotate(18deg);opacity:0}}
.zam .arm{animation:zamArm .5s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:50% 0}@keyframes zamArm{from{transform:rotate(-22deg)}to{transform:rotate(22deg)}}
.zam .arm2{animation:zamArm .5s ease-in-out infinite alternate-reverse;transform-box:fill-box;transform-origin:50% 0}
.zam .whl{animation:zamWhl 1s linear infinite;transform-box:fill-box;transform-origin:center}@keyframes zamWhl{to{transform:rotate(360deg)}}
.zam .flap2{animation:zamFlp .4s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:0 0}@keyframes zamFlp{from{transform:skewX(-8deg)}to{transform:skewX(10deg)}}
.zam .pole{animation:zamPole .5s ease-in-out infinite alternate}@keyframes zamPole{from{transform:translateY(0)}to{transform:translateY(-3px)}}
.zam .bsk{animation:zamBsk .5s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:50% 0}@keyframes zamBsk{from{transform:rotate(-6deg)}to{transform:rotate(6deg)}}
.zam .sk{animation:zamSk 1.2s ease-in-out infinite;transform-box:fill-box;transform-origin:20% 10%}@keyframes zamSk{0%,100%{transform:rotate(-10deg)}50%{transform:rotate(40deg)}}
.zam .kite{animation:zamKite 3s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:50% 100%}@keyframes zamKite{from{transform:rotate(-10deg) translateY(0)}to{transform:rotate(10deg) translateY(-14px)}}
.zam .kt{animation:zamKt 1s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:50% 0}@keyframes zamKt{from{transform:skewX(-14deg)}to{transform:skewX(14deg)}}
.zam .wav{animation:zamWav 3s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:50% 100%}@keyframes zamWav{from{transform:skewX(-6deg)}to{transform:skewX(6deg)}}
.zam .fog{animation:zamFog 60s linear infinite}@keyframes zamFog{from{transform:translateX(-500px)}to{transform:translateX(500px)}}
.zam .puff{animation:zamPf 1.6s ease-out infinite;transform-box:fill-box;transform-origin:center}@keyframes zamPf{0%{transform:translate(0,0) scale(.5);opacity:.95}100%{transform:translate(-40px,-50px) scale(1.8);opacity:0}}
.zam .sw{animation:zamSwg 2.4s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:50% 0}@keyframes zamSwg{from{transform:rotate(-16deg)}to{transform:rotate(16deg)}}
.zam .win{animation:zamWn 3s ease-in-out infinite alternate}@keyframes zamWn{from{opacity:.6}to{opacity:1}}
.zam .cl{animation:zamCl 80s linear infinite}@keyframes zamCl{from{transform:translateX(-300px)}to{transform:translateX(1500px)}}
.zam .flap{animation:zamFp .35s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:50% 100%}@keyframes zamFp{from{transform:scaleY(1)}to{transform:scaleY(-.6)}}

/* ══ RENDER ══ */
function build(m,gid){
 const c=document.createElement('div');c.className='q';c.id='c_'+gid;
 const h='<span class="qn">'+m.num+'</span>';
 if(m.t==='mcq'){
  const so=shuffle(m.opts);maps[gid]=so;
  c.innerHTML='<div class="qt">'+h+m.q+'</div><div class="og '+(m.cls||'')+'" id="o_'+gid+'">'+
   so.map((o,i)=>'<button class="ob" onclick="pick(\''+gid+'\','+i+')">'+o+'</button>').join('')+
   '</div><div class="ex" id="e_'+gid+'">'+m.ex+'</div>';
 } else if(m.t==='fix'){
  c.innerHTML='<div class="qt">'+h+'Tìm ô chứa lỗi rồi sửa lại cho đúng:</div>'+
   '<div class="segs" id="sg_'+gid+'">'+
   m.parts.map(p=>'<span class="sg" data-l="'+p[0]+'" onclick="selg(\''+gid+'\',\''+p[0]+'\')">'+
     '<b>'+p[0]+'</b>'+p[1]+'</span>').join('')+'</div>'+
   '<div class="hint" id="hn_'+gid+'">👆 <b>Bước 1:</b> bấm vào ô con cho là SAI.</div>'+
   '<div class="fz" id="fz_'+gid+'"><span class="fzl" id="fl_'+gid+'"></span>'+
   '<input class="ti" id="i_'+gid+'" placeholder="Gõ phần đã sửa..." autocomplete="off" spellcheck="false">'+
   '<button class="ck" id="b_'+gid+'">Kiểm tra</button></div>'+
   '<div class="ex" id="e_'+gid+'">'+m.ex+'</div>';
  const bt=c.querySelector('#b_'+gid),inp=c.querySelector('#i_'+gid);
  bt.onclick=()=>chkf(gid);
  inp.addEventListener('keydown',e=>{if(e.key==='Enter')chkf(gid)});
 } else {
  c.innerHTML='<div class="qt">'+h+m.q+'</div>'+
   '<div class="fr"><input class="ti" id="i_'+gid+'" placeholder="'+m.ph+'" autocomplete="off" spellcheck="false">'+
   '<button class="ck" id="b_'+gid+'">Kiểm tra</button></div><div class="ex" id="e_'+gid+'">'+m.ex+'</div>';
  const inp=c.querySelector('#i_'+gid),bt=c.querySelector('#b_'+gid);
  const go=()=>{
   if(done[gid])return;
   const v=norm(inp.value);
   if(!v){inp.classList.add('no');c.classList.add('shk');
    setTimeout(()=>{inp.classList.remove('no');c.classList.remove('shk')},460);return}
   done[gid]=true;answered++;
   const ok=m.accept.map(norm).indexOf(v)>-1;
   inp.disabled=true;bt.disabled=true;inp.classList.add(ok?'ok':'no');
   document.getElementById('e_'+gid).classList.add('show');
   if(ok){score++;ding();confetti()}else{buzz();c.classList.add('shk');setTimeout(()=>c.classList.remove('shk'),460)}
   bump();
  };
  bt.onclick=go;inp.addEventListener('keydown',e=>{if(e.key==='Enter')go()});
 }
 return c;
}
/* ---- chọn ô sai ---- */
function selg(gid,L){
 if(done[gid])return;
 sel[gid]=L;
 document.querySelectorAll('#sg_'+gid+' .sg').forEach(s=>s.classList.toggle('sel',s.dataset.l===L));
 document.getElementById('hn_'+gid).innerHTML='✅ Con đã chọn ô <b>'+L+'</b>. '+
  '<b>Bước 2:</b> gõ phần đã sửa rồi bấm <b>Kiểm tra</b>. (Bấm ô khác nếu muốn đổi.)';
 const fz=document.getElementById('fz_'+gid);fz.classList.add('open');
 document.getElementById('fl_'+gid).innerHTML='✏️ Sửa ô <b>'+L+'</b> thành:';
 document.getElementById('i_'+gid).focus();
}
function chkf(gid){
 if(done[gid])return;
 const m=Q[+gid.slice(1)],c=document.getElementById('c_'+gid),fz=document.getElementById('fz_'+gid),
       inp=document.getElementById('i_'+gid),bt=document.getElementById('b_'+gid);
 if(!sel[gid]){c.classList.add('shk');setTimeout(()=>c.classList.remove('shk'),460);return}
 const v=norm(inp.value);
 if(!v){inp.classList.add('no');fz.classList.add('shk');
  setTimeout(()=>{inp.classList.remove('no');fz.classList.remove('shk')},460);return}
 done[gid]=true;answered++;
 const okL=sel[gid]===m.letter, okW=m.accept.map(norm).indexOf(v)>-1, ok=okL&&okW;
 inp.disabled=true;bt.disabled=true;inp.classList.add(okW?'ok':'no');
 document.querySelectorAll('#sg_'+gid+' .sg').forEach(s=>{
  s.classList.remove('sel');s.classList.add('dn');
  if(s.dataset.l===m.letter)s.classList.add('sgok');
  else if(s.dataset.l===sel[gid])s.classList.add('sgno');
  else s.classList.add('sgdim');
 });
 document.getElementById('hn_'+gid).innerHTML= ok
  ? '🎉 <b>Tuyệt vời!</b> Con tìm đúng ô <b>'+m.letter+'</b> và sửa đúng thành <b>'+m.corr+'</b>.'
  : (okL ? '⚠️ Con tìm ĐÚNG ô <b>'+m.letter+'</b> nhưng sửa chưa đúng. Đáp án: <b>'+m.corr+'</b>.'
         : (okW ? '⚠️ Con sửa đúng từ nhưng chọn SAI ô. Lỗi nằm ở ô <b>'+m.letter+'</b>.'
                : '❌ Lỗi nằm ở ô <b>'+m.letter+'</b> và phải sửa thành <b>'+m.corr+'</b>.'));
 document.getElementById('e_'+gid).classList.add('show');
 if(ok){score++;ding();confetti()}else{buzz();c.classList.add('shk');setTimeout(()=>c.classList.remove('shk'),460)}
 bump();
}
function pick(gid,i){
