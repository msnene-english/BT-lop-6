<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>⛵ UNIT 7 · TELEVISION — CONJUNCTIONS p3 — Ms. Chí Nên</title>
<link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@600;700&family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{--rose:#E91E63;--deep:#AD1457;--pink:#FFC2DC;--pink2:#FFD9E8;--lilac:#B388FF;
  --mint:#12B886;--sun:#FFC93C;--bad:#F2455B;--ink:#3B1B2E;--pap:#FFF5F9}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Nunito',sans-serif;color:var(--ink);
  background:linear-gradient(160deg,#FFF0F6,#FFE3EF 55%,#FDEBFF);
  background-attachment:fixed}
body::before{content:'';position:fixed;inset:0;pointer-events:none;z-index:0;
  background-image:radial-gradient(rgba(233,30,99,.10) 1.5px,transparent 1.6px);background-size:22px 22px}
.wrap{position:relative;z-index:1;max-width:860px;margin:0 auto;padding:16px 14px 80px}
h1,h2,h3,.pill,.qn,.sbtn,.ck,.lb,.l{font-family:'Quicksand',sans-serif;font-weight:700}
/* ── STICKY NOTE ── */
.note{position:relative;border-radius:3px 3px 16px 3px;box-shadow:4px 6px 14px rgba(173,20,87,.18)}
.note::after{content:'';position:absolute;right:0;bottom:0;width:24px;height:24px;
  background:linear-gradient(135deg,transparent 50%,rgba(173,20,87,.16) 50%);border-radius:0 0 14px 0}
.pin{position:absolute;top:-9px;left:50%;transform:translateX(-50%);width:18px;height:18px;border-radius:50%;
  background:radial-gradient(circle at 35% 30%,#fff 8%,var(--rose) 45%,var(--deep));box-shadow:0 2px 5px rgba(0,0,0,.25)}
/* ── HEADER ── */
.hdr{background:linear-gradient(180deg,#FFDCEA,var(--pink));padding:18px 18px 16px;text-align:center;
  margin:8px 0 18px;transform:rotate(-.5deg)}
.hdr h1{font-size:clamp(19px,4.2vw,28px);line-height:1.3;color:var(--deep)}
.hdr p{font-size:.83rem;font-weight:800;color:#8A2E56;margin-top:6px}
/* ── SCORE ── */
.sb{position:sticky;top:8px;z-index:9;background:#fff;border-radius:999px;box-shadow:0 4px 14px rgba(173,20,87,.2);
  display:flex;align-items:center;gap:10px;padding:8px 16px;margin-bottom:18px;border:2px solid var(--pink)}
.sb b{font-family:'Quicksand',sans-serif;font-size:1.1rem;color:var(--deep)}
.tr{flex:1;height:11px;background:#FCE4EF;border-radius:999px;overflow:hidden}
.fl{height:100%;width:0;background:linear-gradient(90deg,var(--rose),var(--lilac),var(--mint));transition:width .45s}
/* ── SECTION ── */
.sec{background:linear-gradient(180deg,#FFF7FA,#FFEFF6);padding:16px 14px 18px;margin-bottom:24px}
.sec:nth-child(even){transform:rotate(.35deg)}
.sec:nth-child(odd){transform:rotate(-.3deg)}
.st{display:flex;flex-wrap:wrap;align-items:center;gap:9px;margin:2px 0 5px}
.pill{color:#fff;border-radius:999px;padding:2px 14px;font-size:.95rem;box-shadow:0 3px 8px rgba(173,20,87,.25)}
.st h2{font-size:1.08rem;line-height:1.35;color:var(--deep)}
.si{font-size:.89rem;font-weight:700;color:#8A2E56;font-style:italic;margin:2px 0 12px;line-height:1.6}
/* ── THEORY ── */
.th{background:linear-gradient(180deg,#FFF9DC,#FFF3BF);padding:12px 13px 14px;margin-bottom:14px;
  border-radius:3px 3px 14px 3px;box-shadow:3px 4px 10px rgba(160,120,0,.16);position:relative}
.th::after{content:'';position:absolute;right:0;bottom:0;width:22px;height:22px;
  background:linear-gradient(135deg,transparent 50%,rgba(160,120,0,.15) 50%);border-radius:0 0 12px 0}
.th h3{font-size:1rem;color:#8A6100;margin-bottom:9px;line-height:1.4}
.ru{background:#fff;border-left:6px solid var(--rose);border-radius:0 10px 10px 0;padding:7px 11px;margin-bottom:7px;
  font-size:.93rem;line-height:1.75;font-weight:700;box-shadow:0 2px 6px rgba(0,0,0,.06)}
.ru b{color:var(--deep)}
.eg{display:inline-block;background:#FFE9F2;border:1.5px solid var(--rose);border-radius:8px;padding:0 8px;
  font-weight:800;color:var(--deep);margin:2px 3px 0 0}
.tb{width:100%;border-collapse:collapse;margin:8px 0;font-size:.87rem}
.tb th{background:var(--rose);color:#fff;padding:6px 8px;border:1.5px solid #fff;font-family:'Quicksand',sans-serif;font-size:.9rem}
.tb td{background:#fff;padding:6px 8px;border:1.5px solid #FAD4E4;font-weight:700;line-height:1.65}
.tb tr:nth-child(even) td{background:#FFF7FA}
.tb td b{color:var(--mint)}.tb td s{color:var(--bad)}
.tip{background:#E4FBF4;border:2px solid var(--mint);border-radius:12px;padding:8px 12px;font-size:.92rem;
  font-weight:700;line-height:1.78;color:#065F46}
.wn{background:#FFECEF;border:2px solid var(--bad);border-radius:12px;padding:8px 12px;font-size:.92rem;
  font-weight:700;line-height:1.78;color:#9F1239;margin-top:8px}
.wn s{color:#BE123C}
/* ── WORD BOX ── */
.wb{background:#F6EEFF;border:2px dashed var(--lilac);border-radius:14px;padding:10px 12px 12px;margin-bottom:14px}
.wb .lb{font-size:.9rem;color:#6D28D9;margin-bottom:7px}
.wb .cs{display:flex;flex-wrap:wrap;gap:7px}
.wb span{background:#fff;border:2px solid var(--lilac);border-radius:9px;padding:3px 12px;font-weight:800;
  font-size:.93rem;box-shadow:0 2px 5px rgba(109,40,217,.15)}
/* ── QUESTION ── */
.q{background:#fff;border-radius:3px 3px 13px 3px;padding:11px 12px 12px;margin-bottom:11px;
  box-shadow:2px 3px 9px rgba(173,20,87,.13);border-left:5px solid var(--pink)}
.q.shk{animation:shk .42s}
@keyframes shk{0%,100%{transform:translateX(0)}25%{transform:translateX(-7px)}75%{transform:translateX(7px)}}
.qn{display:inline-block;background:var(--rose);color:#fff;border-radius:8px;min-width:30px;text-align:center;
  padding:0 8px;margin-right:7px;font-size:.93rem;box-shadow:0 2px 5px rgba(233,30,99,.35)}
.qt{font-weight:700;font-size:1rem;line-height:1.85}
.qt .bl{display:inline-block;min-width:94px;border-bottom:3px solid var(--rose);text-align:center;color:var(--rose);font-weight:900}
.src{background:#FFF7FA;border-left:5px solid var(--lilac);border-radius:0 11px 11px 0;padding:8px 12px;margin-top:8px;
  font-weight:800;font-size1rem;font-size:1rem;line-height:1.8}
.src .u{background:var(--sun);border-radius:5px;padding:0 6px;font-weight:900}
.src .kw{display:inline-block;background:#F6EEFF;border:1.5px solid var(--lilac);border-radius:8px;padding:0 9px;
  font-family:'Quicksand',sans-serif;color:#6D28D9}
.ans{display:inline-block;background:#E4FBF4;border:1.5px dashed var(--mint);border-radius:8px;padding:1px 9px;
  color:#065F46;font-weight:800;font-size:.95em}
/* hội thoại */
.dlg{background:#FFF7FA;border-radius:12px;padding:9px 12px;margin-top:8px;font-size:.99rem;line-height:2.05;font-weight:700}
.dlg .b{color:var(--rose);font-weight:900}
.dlg .d{color:#0B72A8;font-weight:900}
.dlg .gap{display:inline-block;background:var(--sun);border-radius:6px;padding:0 8px;font-family:'Quicksand',sans-serif;font-size:.9rem}
.dlg .hit{background:#E4FBF4;border-radius:5px;padding:0 5px}
/* ── OPTIONS ── */
.og{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.og.c4{grid-template-columns:repeat(4,1fr)}
.og.c1{grid-template-columns:1fr}
@media(max-width:640px){.og.c4{grid-template-columns:repeat(2,1fr)}}
@media(max-width:520px){.og{grid-template-columns:1fr}}
.ob{background:#FFF7FA;border:2px solid var(--pink);border-radius:11px;padding:9px 12px;font-family:'Nunito';
  font-size:.96rem;font-weight:800;cursor:pointer;box-shadow:0 3px 7px rgba(173,20,87,.12);transition:.14s;
  text-align:center;line-height:1.5;color:var(--ink)}
.ob.lft{text-align:left;font-weight:700;font-size:.94rem}
.ob:hover:not(.dn){transform:translateY(-2px);background:#FFEAF3;border-color:var(--rose)}
.ob.ok{background:#D7F7EC;border-color:var(--mint);color:#065F46}
.ob.no{background:#FFE1E6;border-color:var(--bad);color:#9F1239}
.ob.dim{opacity:.4}
/* ── INPUT ── */
.fr{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:9px}
.ti{flex:1;min-width:190px;padding:9px 13px;border:2px solid var(--pink);border-radius:11px;font-family:'Nunito';
  font-size:.98rem;font-weight:800;outline:none;background:#FFFDFE;box-shadow:0 2px 6px rgba(173,20,87,.1)}
.ti:focus{border-color:var(--rose);background:#fff}
.ti.ok{border-color:var(--mint);background:#D7F7EC}
.ti.no{border-color:var(--bad);background:#FFE1E6}
.ck{background:var(--rose);color:#fff;border:none;border-radius:11px;padding:10px 20px;font-size:1rem;cursor:pointer;
  box-shadow:0 4px 10px rgba(233,30,99,.35);white-space:nowrap}
.ck:hover:not(:disabled){transform:translateY(-2px)}
.ck:disabled{opacity:.4;cursor:default}
.hb{margin-top:9px;background:#FFF9DC;border:1.5px dashed var(--sun);border-radius:10px;padding:7px 11px;
  font-size:.87rem;font-weight:700;color:#8A6100;line-height:1.7}
/* ── EXPLANATION ── */
.ex{display:none;margin-top:10px;background:#FFFDFE;border-radius:12px;padding:12px;font-size:.94rem;line-height:1.75;
  box-shadow:0 3px 10px rgba(173,20,87,.14);border:1.5px solid #FAD4E4}
.ex.show{display:block}
.kb{background:#D7F7EC;border:1.5px solid var(--mint);border-radius:9px;padding:7px 11px;margin-bottom:8px;
  font-weight:900;color:#065F46;line-height:1.7}
.vi{background:#FFF7E0;border-left:4px solid var(--sun);border-radius:0 8px 8px 0;padding:6px 11px;margin-bottom:8px;
  font-weight:700;color:#8A6100;line-height:1.7}
.sp{background:#FFF7FA;border:1.5px solid #FAD4E4;border-radius:9px;padding:7px 11px;margin-bottom:7px;line-height:1.75}
.sp .l{display:inline-block;background:var(--lilac);color:#fff;border-radius:6px;padding:0 8px;font-size:.85rem;margin-bottom:3px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin:5px 0}
@media(max-width:600px){.g2{grid-template-columns:1fr}}
.g2>div{background:#fff;border:1.5px solid #FAE0EB;border-radius:8px;padding:5px 9px;line-height:1.65;font-weight:700}
.w{color:#1D4ED8;font-weight:800}.m{color:#C2410C;font-weight:700}.g{color:var(--mint);font-weight:900}
.t{background:#FCE7F1;color:#8A2E56;padding:1px 5px;border-radius:4px;font-size:.78em;font-weight:800;margin:0 3px}
.pg{background:linear-gradient(transparent 54%,#FFE066 54%);font-weight:800;line-height:2}
.nx{background:#FFE1E6;border:1.5px solid var(--bad);border-radius:5px;padding:0 5px;color:#9F1239;font-weight:800}
.yx{background:#D7F7EC;border:1.5px solid var(--mint);border-radius:5px;padding:0 5px;color:#065F46;font-weight:900}
.rel{display:inline-block;border-radius:8px;padding:1px 10px;font-family:'Quicksand',sans-serif;font-size:.9rem;margin:2px 3px 2px 0}
.r1{background:#D7F7EC;color:#065F46}.r2{background:#FFE1E6;color:#9F1239}
.r3{background:#E0F2FE;color:#075985}.r4{background:#FFF3BF;color:#8A6100}.r5{background:#F6EEFF;color:#6D28D9}
/* ── SUBMIT / MODAL ── */
.sub{text-align:center;margin-top:22px}
.sbtn{background:var(--rose);color:#fff;border:none;border-radius:999px;padding:13px 40px;font-size:1.2rem;
  cursor:pointer;box-shadow:0 6px 16px rgba(233,30,99,.4)}
.sbtn:hover{transform:translateY(-2px)}
.ov{position:fixed;inset:0;background:rgba(59,27,46,.7);z-index:99;display:none;align-items:center;justify-content:center;
  padding:16px;overflow-y:auto;backdrop-filter:blur(3px)}
.ov.on{display:flex}
.mb{background:linear-gradient(180deg,#FFF7FA,#FFEAF3);border-radius:3px 3px 18px 3px;box-shadow:5px 7px 22px rgba(0,0,0,.35);
  padding:22px;width:410px;max-width:96%;text-align:center;position:relative}
.mb h2{font-size:1.35rem;color:var(--deep);margin-bottom:10px;line-height:1.25}
.mb input{width:100%;padding:11px;border:2px solid var(--pink);border-radius:11px;font-family:'Nunito';font-weight:800;
  font-size:1rem;text-align:center;outline:none;margin-bottom:10px}
.mb input.er{border-color:var(--bad);background:#FFE1E6;animation:shk .42s}
.mb .em{color:var(--bad);font-weight:800;font-size:.86rem;display:none;margin-bottom:8px}
.mb .gr{font-family:'Quicksand',sans-serif;font-weight:700;font-size:1.22rem;color:var(--deep);line-height:1.3;margin-bottom:4px}
.mb .rs{font-family:'Quicksand',sans-serif;font-weight:700;font-size:2.5rem;color:var(--rose)}
.mb .rt{font-weight:900;color:#6D28D9;font-size:1.08rem;margin:4px 0 6px}
.mb .rm{font-weight:700;font-size:.93rem;line-height:1.65;margin-bottom:10px}
.mb img{width:100%;max-width:250px;border-radius:13px;margin:10px auto;display:block;box-shadow:0 4px 12px rgba(0,0,0,.2)}
.cf{position:fixed;top:-12px;width:9px;height:14px;z-index:100;pointer-events:none;border-radius:2px}
@keyframes fall{to{transform:translateY(105vh) rotate(700deg);opacity:.2}}
</style>

let AC;function ac(){if(!AC)AC=new (window.AudioContext||window.webkitAudioContext)();if(AC.state==='suspended')AC.resume();return AC}
function ding(){try{const c=ac(),n=c.currentTime;[523,659,784,1047].forEach((f,i)=>{const o=c.createOscillator(),g=c.createGain();
 o.type='sine';o.frequency.value=f;o.connect(g);g.connect(c.destination);const t=n+i*.09;
 g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(.19,t+.03);g.gain.exponentialRampToValueAtTime(.001,t+.42);
 o.start(t);o.stop(t+.45)})}catch(e){}}
function buzz(){try{const c=ac(),n=c.currentTime;[300,235,180].forEach((f,i)=>{const o=c.createOscillator(),g=c.createGain();
 o.type='square';o.frequency.value=f;o.connect(g);g.connect(c.destination);const t=n+i*.12;
 g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(.11,t+.02);g.gain.exponentialRampToValueAtTime(.001,t+.17);
 o.start(t);o.stop(t+.19)})}catch(e){}}

 for(let i=0;i<32;i++){const d=document.createElement('div');d.className='cf';d.style.background=c[i%c.length];

  d.style.animationDelay=(Math.random()*.3)+'s';document.body.appendChild(d);setTimeout(()=>d.remove(),3200)}}
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}

   answer,accept,EX('<b>'+answer+'</b> '+q,vn,cells,why,trap),
   '✍️ Gõ từ để hỏi (viết hoa hay thường đều được).','Từ để hỏi...');
}

function build(m,gid){
 const c=document.createElement('div');c.className='q';c.id='c_'+gid;
 const h='<span class="qn">'+m.num+'</span>';
 if(m.t==='mcq'){
  const so=shuffle(m.opts);maps[gid]=so;
  const one=m.cls==='c1';
  c.innerHTML='<div class="qt">'+h+m.q+'</div><div class="og '+(m.cls||'')+'" id="o_'+gid+'">'+
   so.map((o,i)=>'<button class="ob'+(one?' lft':'')+'" onclick="pick(\''+gid+'\','+i+')">'+o+'</button>').join('')+
   '</div><div class="ex" id="e_'+gid+'">'+m.ex+'</div>';
 } else {
  c.innerHTML='<div class="qt">'+h+m.q+'</div>'+(m.hint?'<div class="hb">'+m.hint+'</div>':'')+
   '<div class="fr"><input class="ti" id="i_'+gid+'" placeholder="'+m.ph+'" autocomplete="off" spellcheck="false">'+
   '<button class="ck" id="b_'+gid+'">Kiểm tra</button></div><div class="ex" id="e_'+gid+'">'+m.ex+'</div>';
  const inp=c.querySelector('#i_'+gid),bt=c.querySelector('#b_'+gid);
  const go=()=>{
   if(done[gid])return;
   const v=norm(inp.value);
   if(!v){inp.classList.add('no');c.classList.add('shk');
    setTimeout(()=>{inp.classList.remove('no');c.classList.remove('shk')},460);return}
   done[gid]=true;answered++;
   const ok=m.accept.map(norm).indexOf(v)>-1;
   inp.disabled=true;bt.disabled=true;inp.classList.add(ok?'ok':'no');
   document.getElementById('e_'+gid).classList.add('show');
   if(ok){score++;ding();confetti()}else{buzz();c.classList.add('shk');setTimeout(()=>c.classList.remove('shk'),460)}
   bump();
  };
  bt.onclick=go;inp.addEventListener('keydown',e=>{if(e.key==='Enter')go()});
 }
 return c;
}
function pick(gid,i){
 if(done[gid])return;done[gid]=true;answered++;
 const m=Q[+gid.slice(1)],b=document.getElementById('o_'+gid),c=document.getElementById('c_'+gid);
 const ok=maps[gid][i]===m.correct;
 [...b.children].forEach((el,j)=>{el.disabled=true;el.classList.add('dn');
  if(maps[gid][j]===m.correct)el.classList.add('ok');
  else if(j===i)el.classList.add('no');else el.classList.add('dim')});
 document.getElementById('e_'+gid).classList.add('show');
 if(ok){score++;ding();confetti()}else{buzz();c.classList.add('shk');setTimeout(()=>c.classList.remove('shk'),460)}
 bump();
}

 else if(pct>=.6){g='🌟 GIỎI LẮM, '+nm+'!';msg='Con làm rất tốt rồi. Nhớ mẹo SO ↔ BECAUSE ngược thứ tự và bảng tra từ hỏi nhé!';

 else{g='🌱 CỐ LÊN NÀO, '+nm+'!';msg='Đừng buồn! Đọc lại bảng 6 liên từ và bảng tra ngược từ hỏi rồi làm lại nhé! 📚';
  gif='https://media.giphy.com/media/d2lcHJTG5Tscg/giphy.gif';}
 document.getElementById('rG').textContent=g;
 document.getElementById('rS').textContent=score+' / '+TOTAL;

<script>/*scnjs*/
(function(){
 const STOP=new Set(['the','a','an','and','or','but','so','because','although','is','are','was','were','do','does','did','you','your','he','she','they','it','we','i','my','his','her','their','our','to','of','in','on','at','for','with','what','who','where','when','why','how','which','that','this','these','those','can','will','not','very','too','also','there','have','has','had','be','me','him','them','its','am']);
 function clean(t){return String(t).replace(/<(br|\/div|\/p)[^>]*>/gi,' ').replace(/<[^>]+>/g,'').replace(/&rsquo;|&#39;|\u2019/g,"'").replace(/&[a-z]+;/g,' ').trim()}
 function words(m){if(!m)return[];let ws=[];
  const parts=m.t==='mcq'?m.opts.map(clean):[clean(m.correct)];
  if(parts.every(p=>p.split(/\s+/).length<=3))ws=parts;
  else ws=clean(m.correct).toLowerCase().replace(/[^a-z' -]/g,' ').split(/\s+/).filter(w=>w.length>3&&!STOP.has(w)&&w.indexOf("'")<0).slice(0,4);
  return [...new Set(ws.map(w=>w.toLowerCase().replace(/[^a-z' -]/g,' ').replace(/\s+/g,' ').trim()).filter(w=>w&&w.length<28&&w.split(' ').length<=3))];}
 function cbHTML(ws){if(!ws.length)return '';return '<div class="cbw">🔊 <b>Tra từ điển Cambridge:</b> bấm vào từng từ để nghe phát âm chuẩn rồi đọc theo thật to nhé!<div class="cbl">'+
  ws.map(w=>'<a href="https://dictionary.cambridge.org/vi/dictionary/english/'+encodeURIComponent(w.replace(/ /g,'-'))+'" target="_blank" rel="noopener">🔊 '+w+'</a>').join('')+'</div></div>';}
 function addCB(e){if(!e||e.querySelector('.cbw'))return;const k=+String(e.id).replace('e_g','');if(isNaN(k))return;e.insertAdjacentHTML('beforeend',cbHTML(words(Q[k])))}
 const mo=new MutationObserver(ms=>ms.forEach(m=>{const e=m.target;if(e.classList&&e.classList.contains('ex')&&e.classList.contains('show'))addCB(e)}));
 document.querySelectorAll('.ex').forEach(e=>mo.observe(e,{attributes:true,attributeFilter:['class']}));
 const duck=function(){try{const a=new Audio('https://hoctienganhcungcoMs. Chí Nên.github.io/homework/%E1%BA%A2nh_File%20nghe/Sound/Ti%E1%BA%BFng%20V%E1%BB%8Bt%20k%C3%AAu%20meme%20mp3.mp3');a.volume=.85;a.play().catch(()=>{})}catch(e){}};
 window.buzz=duck;try{buzz=duck}catch(x){}
})();</script>
<script>/*devclean*/(function(){
var ZW=/[\u00AD\u034F\u061C\u115F\u1160\u17B4\u17B5\u180E\u200B-\u200F\u202A-\u202E\u2060-\u206F\uFEFF]/g,
    SP=/[\u00A0\u1680\u2000-\u200A\u2028\u2029\u202F\u205F\u3000\t]/g,
    AP=/[\u2018\u2019\u201A\u201B\u2032\u2035\u02B9\u02BB\u02BC\u02BD\u02C8\u0060\u00B4\uFF07]/g,
    DQ=/[\u201C\u201D\u201E\u201F\u2033\u2036\u00AB\u00BB\uFF02]/g,
    DS=/[\u2010\u2011\u2012\u2212\uFE63\uFF0D]/g;
function clean(v){if(!v)return v;var s=String(v);try{s=s.normalize('NFKC')}catch(e){}
  return s.replace(ZW,'').replace(SP,' ').replace(AP,"'").replace(DQ,'"').replace(DS,'-').replace(/[\u0300-\u036f]/g,'').replace(/ {2,}/g,' ');}
window.__devclean=clean;
function fix(skip){var L=document.querySelectorAll('input:not([type]),input[type=text],input[type=search],textarea');
  for(var i=0;i<L.length;i++){var el=L[i];if(el===skip||el.readOnly||el.disabled)continue;var v=el.value,c=clean(v);if(c!==v)el.value=c;}}
['pointerdown','mousedown','touchstart','click','change','focusout'].forEach(function(t){document.addEventListener(t,function(e){fix(t==='focusout'||t==='change'?null:e.target)},true)});
document.addEventListener('keydown',function(e){if(e.key==='Enter'||e.keyCode===13)fix(null)},true);
})();</script>
